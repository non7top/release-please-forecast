name: release-please-preview

# This action previewing its own release PRs is the strongest test it has.
# The bug in #2 only ever appeared on release-please's own release PR, which
# is a shape no unit test reproduces and which this repo now generates for
# itself — so a regression there shows up as a visibly wrong preview comment
# on the very PR that caused it.
on:
  pull_request:
    # `edited` isn't a GitHub default. The prediction reads the PR title, so
    # retitling a PR changes the answer, and without this that retitle
    # triggers nothing — see the README section on activity types.
    types: [opened, synchronize, reopened, edited]
    branches: [master]

# A force-push and a retitle landing together deliver `synchronize` and
# `edited` about a second apart, starting two runs against the same head
# SHA but different PR titles — and so different predictions. Both then
# delete and repost this PR's comment and set its label, with no ordering
# between them, so the run that happens to finish last wins whether or not
# it held the newer title. Cancelling the older run is the only fix that
# covers the label too, a label having no body to carry a freshness stamp
# in. Keyed per PR, so concurrent PRs still preview in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the action walks back to the last release
          # tag and builds its own merge commit on top of this clone. Its
          # preflight checks warn if this is ever dropped.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # `./`, deliberately, not `@v1`: this runs the action *as the PR would
      # change it*, so a PR that breaks the prediction fails its own preview
      # rather than shipping and breaking consumers. Testing the already
      # released version here would defeat the point of running it at all.
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
