name: 'Predict next version'
description: >-
  Simulates the exact merge commit GitHub would create for this PR (subject
  "Merge pull request #N from owner/branch", body: the current PR title) and
  dry-runs release-please against it. This repo only merges via "Create a
  merge commit," and GitHub bakes the PR title into that commit's body,
  which release-please reads as its own conventional commit — so a plain
  dry-run against just the PR branch's own commits can under-predict the
  real bump if the PR title has drifted from what those commits actually
  say. release-please's own release PR is answered from its manifest bump
  instead of being dry-run, since dry-running that one mispredicts badly.
  Optionally also posts/updates the release-please-preview PR comment and
  toggles the release label as a side effect.

inputs:
  github-token:
    description: >-
      Token for release-please's own API calls and (if post-comment is
      true) for commenting/labeling the PR. Composite actions can't read
      the secrets context directly, so this must be passed in explicitly
      from the calling workflow (e.g. secrets.GITHUB_TOKEN).
    required: true
  post-comment:
    description: >-
      Whether to also post/update the release-please-preview PR comment and
      set/remove the release label as a side effect of running this action.
    required: false
    default: 'true'
  release-label:
    description: >-
      Name of the label to create (if missing) and add/remove/recolor on
      the PR when post-comment is true, to flag whether merging it would
      trigger a release and (via color) what kind of bump it would be.
    required: false
    default: 'RELEASE'
  preflight:
    description: >-
      Whether to check the calling workflow and repository for the setup
      this action depends on — full history, merge-commit merging, the
      `edited` activity type, release-please's own config — and report
      anything missing, both as job annotations and at the top of the
      preview comment when post-comment is true. Warnings only: preflight
      never fails the run, and stays quiet whenever it can't tell for
      certain.
    required: false
    default: 'true'
  package-name:
    description: >-
      Key into `.release-please-manifest.json` this action reads the
      current version from and classifies the predicted bump against.
      Leave empty for the common layout, where the whole repository is one
      package keyed by "."; this action falls back to the manifest's first
      key when "." is absent, which only tracks the whole repo's version
      correctly when every package in the manifest is kept at the same
      version by a linked-versions group with merge: true. Set this
      explicitly for any other multi-package layout (e.g. a cargo-workspace
      repo whose packages release independently), naming the one package
      this prediction should follow.
    required: false
    default: ''

outputs:
  version:
    description: >-
      Predicted next version (e.g. "1.2.0") if this PR were merged right
      now. Empty when there are no releasable changes, and also when a
      release would happen but the version couldn't be predicted with
      confidence — check would-release to tell the two apart.
    value: ${{ steps.extract.outputs.version }}
  would-release:
    description: Whether merging this PR would trigger a release ("true"/"false").
    value: ${{ steps.extract.outputs.would_release }}
  pr-contributes:
    description: >-
      Whether this PR itself adds releasable changes ("true"/"false"). "false"
      with would-release "true" means a release is already pending on the base
      branch and this PR would merely be part of it.
    value: ${{ steps.extract.outputs.pr_contributes }}
  bump-type:
    description: >-
      Predicted bump type ("major"/"minor"/"patch") if this PR were merged
      right now. Empty in exactly the cases version is empty.
    value: ${{ steps.extract.outputs.bump_type }}

runs:
  using: composite
  steps:
    # Every requirement this action has is one a consumer can get silently
    # wrong: nothing fails, the prediction is just quietly computed from a
    # false premise and reported with the same confidence as a correct one.
    # These checks turn each of them into a visible annotation.
    #
    # They only ever warn, and they stay quiet whenever they can't tell.
    # That asymmetry is deliberate: a warning that fires wrongly on a
    # shared action teaches people to ignore all of its warnings, so a
    # field this token can't read, a workflow file that isn't in the
    # checkout, or anything else ambiguous is left alone rather than
    # guessed at. Missing a real misconfiguration is the cheaper mistake.
    - name: Preflight checks
      if: inputs.preflight == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        # Every warning goes two places: the job's annotations, and a file
        # the comment step reads back. An annotation is only ever seen by
        # someone who thinks to open the run summary, and each of these
        # warnings says some variant of "the version below may be wrong" —
        # which has to reach whoever is about to click merge, on the PR,
        # next to the version itself.
        #
        # The file sits in RUNNER_TEMP rather than the workspace, unlike
        # the action's other scratch files: this step runs before the
        # `git checkout` that builds the simulated merge, and an untracked
        # file in the workspace aborts that checkout if the base branch
        # happens to track a file by the same name.
        WARNINGS_FILE="$RUNNER_TEMP/preflight-warnings.md"
        : > "$WARNINGS_FILE"
        warn() {
          echo "::warning title=release-please-forecast::$1"
          echo "- $1" >> "$WARNINGS_FILE"
        }

        # release-please walks commits back to the last release tag. A
        # shallow clone can cut that walk short, and the version computed
        # from the truncated history looks entirely ordinary — the same
        # class of silent wrongness as a bootstrap replay.
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          warn "This checkout is shallow, so release-please may not see back to the last release and the prediction can be wrong with nothing to indicate it. Set 'fetch-depth: 0' on the checkout step that runs before this action."
        fi

        # The premise of this action is the merge commit GitHub creates,
        # with the PR title in its body. With merge commits disabled,
        # nothing it reports describes what will actually land. The allow_*
        # fields aren't visible to every token, so stderr is dropped and an
        # empty answer is treated as "can't tell" rather than "disabled".
        allow_merge=$(gh api "repos/$REPO" --jq '.allow_merge_commit // empty' 2>/dev/null || true)
        if [ "$allow_merge" = false ]; then
          warn "This repository has merge commits disabled, so its PRs land as squashes or rebases and never produce the merge commit this action simulates. Predictions here will not match what actually lands — see the README's Requirements."
        fi

        # Without the `edited` activity type a retitled PR never re-runs,
        # and the stale comment, label and version output all carry on
        # looking authoritative.
        #
        # Only the workflow that is running gets examined, which needs no
        # YAML parsing at all: this action does nothing except on
        # pull_request events, so that file necessarily has the trigger
        # already, leaving one question — does it mention `edited`. Taking
        # a mention anywhere in the file (a comment included) as configured
        # is the error worth making, and scanning only this one file avoids
        # having to guess which workflows reference this action, which is
        # unanswerable once a repository is renamed or the action is pinned
        # by SHA.
        #
        # `concurrency` is checked the same way and for a related reason.
        # A force-push and a retitle landing together deliver two events —
        # `synchronize` and `edited` — which start two runs against the
        # same head SHA but different PR titles, and so different
        # predictions. Both then delete and repost this PR's comment and
        # set its label, with no ordering between them: the run that
        # happens to finish last wins, whether or not it was the one
        # holding the newer title. Observed in the wild, leaving a `fix:`
        # prediction on a PR that had already been retitled to `chore:`.
        # A concurrency group serialises or cancels them, and is the only
        # one of these that fixes the label too, a label having no body to
        # carry a freshness stamp in.
        workflow_path="${WORKFLOW_REF%@*}"
        workflow_path="${workflow_path#"$REPO/"}"
        if [ -n "$workflow_path" ] && [ -f "$workflow_path" ]; then
          if ! grep -q 'concurrency' "$workflow_path"; then
            warn "'$workflow_path' declares no 'concurrency' group, so two events arriving together (a force-push and a retitle, say) start two runs that both write this PR's comment and label, and whichever finishes last wins — even when it is the one holding the older PR title. Add 'concurrency: { group: <workflow>-<pr>, cancel-in-progress: true }'. See the README."
          fi
          if ! grep -q 'edited' "$workflow_path"; then
            warn "'$workflow_path' doesn't list the 'edited' pull_request activity type, which GitHub doesn't enable by default. This action reads the PR title into its prediction, so retitling a PR changes the answer — and without 'edited' that retitle triggers no run, leaving the preview comment, the release label and the 'version' output all asserting the previous prediction. See the README."
          fi
        fi

        # release-please's own configuration isn't this action's to create —
        # it only previews an existing setup — but missing files turn the
        # prediction into nonsense rather than into an error.
        if [ ! -f release-please-config.json ]; then
          warn "No 'release-please-config.json' in this checkout. This action previews an existing release-please setup rather than replacing one, and release-please can't compute a release without its config."
        fi
        if [ ! -f .release-please-manifest.json ]; then
          warn "No '.release-please-manifest.json' in this checkout, so the current version can't be read and the bump can't be classified — 'version' and 'bump-type' will come back empty."
        elif [ -z "$PACKAGE_NAME" ] && ! jq -e 'has(".")' .release-please-manifest.json > /dev/null 2>&1; then
          # A manifest keyed by package path rather than "." (cargo-workspace
          # + linked-versions, say) has no single repo-wide version to read.
          # Guessing the manifest's first key is only right when every
          # package in it moves together, and this check can't tell that —
          # it only sees the manifest, not the plugin config that groups
          # packages — so it warns unconditionally rather than trying to
          # infer linkage from release-please-config.json's shape.
          warn "'.release-please-manifest.json' has no '.' key, so this action is guessing the repo's version from the manifest's first key. That's only correct if every package in the manifest is kept at the same version by a linked-versions group with merge: true — set the 'package-name' input to the package this prediction should follow otherwise. See the README."
        fi

    # release-please's own release PR is the one PR this action must *not*
    # dry-run, because merging it moves .release-please-manifest.json to a
    # version that has no tag or GitHub release behind it — that release is
    # exactly what the PR is proposing. release-please then can't find the
    # commit of the "last release" it reads from the manifest, concludes the
    # repo still needs bootstrapping, and stops breaking out of its commit
    # walk early, so it replays the *entire* history from the first commit.
    # That both re-lists every commit ever in the changelog and lets an
    # ancient `Release-As:` footer (release-please's own bootstrap commit
    # carries one) override the computed bump — e.g. a repo at 4.0.2 being
    # told merging its 4.1.0 release PR would release 1.0.0.
    #
    # Nothing needs predicting for that PR anyway: the version merging it
    # publishes is the one written in its own manifest bump, and the
    # changelog is its own description. So detect it and read the answer
    # off the PR instead of asking release-please to re-derive it.
    #
    # Two independent signals, since either can be customized away: the
    # branch prefix release-please opens its release PRs with, and the
    # label it puts on them (release-please's default `labels`).
    - name: Detect release-please's own release PR
      id: detect
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
      run: |
        is_release_pr=false
        case "$HEAD_REF" in
          release-please--*) is_release_pr=true ;;
        esac
        if printf '%s' "$PR_LABELS" | grep -qF '"autorelease: pending"'; then
          is_release_pr=true
        fi
        echo "is_release_pr=$is_release_pr" >> "$GITHUB_OUTPUT"

    - name: Build the merge commit GitHub would create
      id: build_merge
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        HEAD_LABEL: ${{ github.event.pull_request.head.repo.owner.login }}/${{ github.head_ref }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        git fetch origin "$BASE_REF:refs/heads/preview-base" "$HEAD_SHA:refs/heads/preview-head"
        git checkout -b preview-merge preview-base

        # Recorded so the comment can name the base commit it predicted
        # against. The base is the input that moves without anything
        # re-running this action — another PR merging is not an event on
        # this one — so a reader comparing this against the current tip of
        # the base branch is the only way to tell a current preview from a
        # stale one.
        echo "base_sha=$(git rev-parse preview-base)" >> "$GITHUB_OUTPUT"

        MERGE_MESSAGE=$(printf 'Merge pull request #%s from %s\n\n%s' "$PR_NUMBER" "$HEAD_LABEL" "$PR_TITLE")
        if git -c user.name="predict-next-version" -c user.email="actions@github.com" \
            merge --no-ff preview-head -m "$MERGE_MESSAGE"; then
          echo "target=preview-merge" >> "$GITHUB_OUTPUT"
          # This commit exists only inside this runner, so release-please
          # will cite a SHA that no GitHub URL resolves to. Recorded here
          # so the changelog entry it produces can be labelled as the
          # merge commit rather than left looking like a second copy of
          # the branch commit. Only set on this path: the conflict
          # fallback below previews the branch head, where no merge commit
          # was made at all.
          echo "merge_sha=$(git rev-parse preview-merge)" >> "$GITHUB_OUTPUT"
        else
          # Base moved in a way that conflicts with the PR since it was
          # opened — fall back to previewing the branch's own commits
          # rather than failing the whole action over it. --abort itself
          # can fail here (e.g. "nothing to abort" for a conflict caught
          # before MERGE_HEAD existed) — harmless, we're abandoning this
          # branch either way.
          git merge --abort || true
          echo "target=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        fi

    # The release-please-action's skip-github-pull-request/skip-github-release
    # inputs don't give a true dry run — every output (prs_created, pr,
    # version, release_created, ...) comes back completely empty when
    # creation is skipped, confirmed directly against a real run and
    # tracked upstream at
    # https://github.com/googleapis/release-please-action/issues/1214
    # The CLI's own --dry-run is the only thing that actually computes
    # without creating anything. --local reads commit history straight
    # from this checkout (via git log), rather than the GitHub API, which
    # is what lets it see our not-yet-pushed simulated merge commit.
    - name: Run release-please dry run
      if: steps.detect.outputs.is_release_pr != 'true'
      shell: bash
      env:
        TOKEN_INPUT: ${{ inputs.github-token }}
      run: |
        npx --yes release-please release-pr \
          --token="$TOKEN_INPUT" \
          --repo-url="${{ github.repository }}" \
          --target-branch="${{ steps.build_merge.outputs.target }}" \
          --local \
          --local-path="$(pwd)" \
          --dry-run > dryrun-output.txt 2>&1 || true

    # The same dry run against the base branch alone, so the comment can
    # tell a PR that causes a release from one that merely lands in a
    # release already pending on the base.
    - name: Run release-please dry run on the base branch
      if: steps.detect.outputs.is_release_pr != 'true'
      shell: bash
      env:
        TOKEN_INPUT: ${{ inputs.github-token }}
      run: |
        npx --yes release-please release-pr \
          --token="$TOKEN_INPUT" \
          --repo-url="${{ github.repository }}" \
          --target-branch="preview-base" \
          --local \
          --local-path="$(pwd)" \
          --dry-run > dryrun-base-output.txt 2>&1 || true

    - name: Extract predicted version
      id: extract
      shell: bash
      env:
        IS_RELEASE_PR: ${{ steps.detect.outputs.is_release_pr }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MERGE_SHA: ${{ steps.build_merge.outputs.merge_sha }}
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        # Echo the bump type between two versions, and nothing at all
        # unless $2 is strictly newer than $1 (including when either isn't
        # a parseable X.Y.Z). A real bump always moves the version forward,
        # so "not strictly newer" means the number we got hold of can't be
        # trusted — and reporting nothing beats reporting a wrong version.
        # Any prerelease/build suffix is ignored; this action only
        # classifies plain X.Y.Z releases.
        classify_bump() {
          from=${1%%[-+]*}
          to=${2%%[-+]*}
          echo "$from" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || return 0
          echo "$to" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || return 0
          IFS='.' read -r f_major f_minor f_patch <<< "$from"
          IFS='.' read -r t_major t_minor t_patch <<< "$to"
          if [ "$t_major" -gt "$f_major" ]; then
            echo major
          elif [ "$t_major" -lt "$f_major" ]; then
            :
          elif [ "$t_minor" -gt "$f_minor" ]; then
            echo minor
          elif [ "$t_minor" -lt "$f_minor" ]; then
            :
          elif [ "$t_patch" -gt "$f_patch" ]; then
            echo patch
          fi
        }

        # Which key in .release-please-manifest.json holds the version this
        # action tracks. classify_bump below can only ever compare two
        # scalar versions, so this only ever speaks to one package's
        # history — the common layout keys the whole repo at ".". A repo
        # split into per-directory packages (release-please's
        # cargo-workspace/linked-versions plugins, say) has no "." entry at
        # all, so PACKAGE_NAME lets a caller name the package that stands
        # in for the repo's version; failing that, the manifest's first key
        # is used, since a linked-versions group with merge: true keeps
        # every member at the same version anyway. Picking the wrong key
        # here silently classifies against the wrong package rather than
        # erroring, which is the tradeoff of guessing at all over the
        # previous hardcoded "." simply coming back empty.
        #
        # `// empty` matters: indexing a manifest that lacks the resolved
        # key makes jq print the string "null", which is not a version but
        # is also not empty, so it would sail past every `-z` check below
        # and be reported as a real version.
        manifest_version() {
          ref="$1"
          if [ -z "$(git ls-tree --name-only "$ref" -- .release-please-manifest.json)" ]; then
            return
          fi
          manifest=$(git show "$ref:.release-please-manifest.json")
          if [ -n "$PACKAGE_NAME" ]; then
            printf '%s' "$manifest" | jq -r --arg k "$PACKAGE_NAME" '.[$k] // empty'
          elif printf '%s' "$manifest" | jq -e 'has(".")' > /dev/null 2>&1; then
            printf '%s' "$manifest" | jq -r '."." // empty'
          else
            printf '%s' "$manifest" | jq -r '[.[]][0] // empty'
          fi
        }

        # The last released version, read from the manifest on the base
        # branch — i.e. before this PR's own changes. Missing rather than
        # fatal: a repo configured some other way still gets a prediction
        # from release-please itself, just no bump classification.
        current_version=$(manifest_version preview-base)

        # The PR that adopts release-please is the one PR whose base branch
        # has no manifest to read — because this PR is what adds it — and
        # was, until this fallback, the one PR this action refused to
        # predict, on a repo where a prediction is most wanted. After the
        # merge release-please classifies the bump against the manifest as
        # this PR leaves it, so that is the honest baseline to classify
        # against here too. Only consulted when the base branch yielded
        # nothing, so it can't override a real released version.
        if [ -z "$current_version" ]; then
          current_version=$(manifest_version preview-head)
        fi

        would_release=false
        candidate=""
        if [ "$IS_RELEASE_PR" = true ]; then
          # Merging release-please's own release PR publishes exactly the
          # version that PR writes into the manifest. Read it from the PR's
          # own head rather than the simulated merge, so this still works
          # when simulating the merge hit a conflict.
          would_release=true
          candidate=$(manifest_version preview-head)
        else
          # "Would open 0 pull requests" still matches /^Would open/, so
          # the trimmed file is never actually empty — check the real count
          # instead of relying on that file having any bytes in it.
          if grep -qE '^Would open [1-9]' dryrun-output.txt; then
            would_release=true
            # `|| true`: a heading release-please writes in some other
            # shape (a prerelease version, say) is a missing prediction,
            # not a reason to fail the whole action — the guard below turns
            # it into an empty version either way.
            candidate=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' dryrun-output.txt | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          fi
        fi

        # release-please's dry-run text doesn't state the bump type
        # directly, so derive it from the two numbers rather than
        # re-parsing commit types ourselves. Doubling as a sanity check:
        # no classification means no trustworthy version to report.
        bump_type=""
        version=""
        unreliable_reason=""
        if [ "$would_release" = true ]; then
          bump_type=$(classify_bump "$current_version" "$candidate")
          if [ -n "$bump_type" ]; then
            version="$candidate"
          elif [ -z "$current_version" ]; then
            unreliable_reason="no current version could be read from \`.release-please-manifest.json\` — neither on \`$BASE_REF\` nor in this PR's own copy of it — so there is nothing to compare a prediction against"
          elif [ -z "$candidate" ]; then
            unreliable_reason="release-please didn't report a plain \`X.Y.Z\` version for this release — this action only recognizes plain semver, so prereleases and other version shapes come back empty"
          else
            unreliable_reason="the version derived for this PR (\`$candidate\`) is not newer than the current \`$current_version\`. That usually means release-please couldn't find the release behind the version in \`.release-please-manifest.json\` — no \`v$current_version\` tag or GitHub release — and so replayed the whole commit history as if bootstrapping the repo. Check that \`$current_version\` was really tagged and released"
          fi
        fi

        # A release already pending on the base produces the same dry-run
        # changelog with or without this PR when the PR adds no entry
        # (a chore, say). Then the PR rides along instead of causing it.
        pr_contributes=$would_release
        if [ "$would_release" = true ] && [ "$IS_RELEASE_PR" != true ] \
            && grep -qE '^Would open [1-9]' dryrun-base-output.txt 2>/dev/null; then
          changelog_body() { sed -n '/^body: /,/^updates: [0-9]*$/p' "$1"; }
          if [ "$(changelog_body dryrun-output.txt)" = "$(changelog_body dryrun-base-output.txt)" ]; then
            pr_contributes=false
          fi
        fi
        echo "pr_contributes=$pr_contributes" >> "$GITHUB_OUTPUT"
        echo "would_release=$would_release" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "bump_type=$bump_type" >> "$GITHUB_OUTPUT"

        # The `body:` field is the exact markdown release-please would put
        # in the real release PR/GitHub release — already valid Markdown
        # (headings, links, bold), not a code block to be displayed
        # verbatim. Strip the "body: " prefix from its first line and keep
        # everything through the line before "updates: N" (a separate,
        # non-body debug field the CLI dumps after it), dropping the
        # fork/title/branch/draft debug lines before it entirely — the
        # preview comment's own header already says what would happen.
        # Headings pass through untouched: the comment's own `#` header
        # already nests them a level down without rewriting anything.
        #
        # One line in that changelog gets rewritten: the entry for the
        # simulated merge commit. GitHub puts the PR title in a merge
        # commit body, so release-please parses the merge commit as a
        # conventional commit of its own and lists it alongside the
        # branch commit — two entries for one change, reading identically
        # whenever the PR title matches the commit subject. That
        # duplication is real and will be in the published changelog too.
        # What is not real is the SHA: the merge commit exists only in
        # this runner, so its link resolves to nothing, and GitHub will
        # make a different one on merge. So the citation is replaced with
        # a name, which is also the thing that makes the second entry
        # legible instead of looking like a bug.
        if [ -f dryrun-output.txt ]; then
          awk -v merge_sha="$MERGE_SHA" '
            function name_merge_commit(line) {
              if (merge_sha != "" && index(line, merge_sha) > 0) {
                sub(/\(\[[0-9a-f]+\]\([^)]*\)\)$/, "(the merge commit GitHub would create for this PR)", line)
              }
              return line
            }
            /^body: / {
              line = substr($0, 7)
              # release-please writes this body for the release PR it is
              # about to open, so it opens in the past tense. Nothing has
              # been created here — this PR is not merged yet, and may
              # never be — so put the lead-in in the tense the rest of the
              # comment is written in. A reworded lead-in upstream just
              # does not match, and passes through as-is.
              sub(/I have created a release/, "I will create a release", line)
              print name_merge_commit(line)
              capturing=1
              next
            }
            capturing && /^updates: [0-9]+$/ { exit }
            capturing { print name_merge_commit($0) }
          ' dryrun-output.txt > trimmed-output.txt

          # A linked-versions group with merge: true still appears to walk
          # one release candidate per linked package internally, each
          # wrapped in its own identical <details><summary>version</summary>
          # block, before ever printing the single combined `updates: N`
          # line the capture above stops at — so the body just captured can
          # already contain that same block repeated once per linked
          # package. Not verified against release-please's own source;
          # dropping repeats defensively here reads right either way this
          # turns out to be caused.
          #
          # Only *consecutive* identical blocks collapse — `prev` resets on
          # any non-blank line that isn't part of a block, so a repeat that
          # is genuinely separated by other content is left alone. This is
          # aimed at the one observed shape, not textual dedup in general.
          awk '
            /^<details>/ { block = $0 "\n"; next }
            block != "" {
              block = block $0 "\n"
              if ($0 == "</details>") {
                if (block != prev) { printf "%s", block; prev = block }
                block = ""
              }
              next
            }
            /^$/ { print; next }
            { print; prev = "" }
          ' trimmed-output.txt > trimmed-output.deduped.txt
          mv trimmed-output.deduped.txt trimmed-output.txt

          # Explain the pair, but only when there is a pair to explain —
          # a PR title that is not a conventional commit produces no
          # merge-commit entry at all, and a note about one would just be
          # noise.
          if grep -qF 'the merge commit GitHub would create for this PR' trimmed-output.txt; then
            {
              echo
              echo "<sub>Two entries, one change: release-please reads both the commit on this branch and the merge commit GitHub will create, whose body is this PR title. Both really do land in the published changelog. Only the merge commit has no SHA to cite, because it does not exist yet.</sub>"
            } >> trimmed-output.txt
          fi
        fi

        # Build the body of the preview comment here, where all four cases
        # are already distinguished, so posting it is just a `cat`.
        {
          if [ "$IS_RELEASE_PR" = true ] && [ -n "$version" ]; then
            echo "Merging release-please's own release PR (\`$HEAD_REF\`) publishes **v$version** — a **$bump_type** bump from \`$current_version\` — and creates the matching tag and GitHub release."
            echo
            echo "The changelog it would publish is this PR's own description, so there's nothing to dry-run here."
          elif [ "$IS_RELEASE_PR" = true ]; then
            echo "⚠️ This is release-please's own release PR (\`$HEAD_REF\`), but the version it proposes couldn't be determined from \`.release-please-manifest.json\` — found \`${candidate:-nothing}\`, against \`${current_version:-nothing}\` on \`$BASE_REF\`. No version is being reported."
          elif [ -n "$unreliable_reason" ]; then
            echo "⚠️ A release would be triggered, but the version isn't being reported, because $unreliable_reason."
            echo
            # Withholding the changelog too made this comment say nothing
            # at all about a PR that would in fact release something —
            # "detects nothing" is how it reads, when the doubt is only
            # over the number. release-please computed a body either way,
            # so show it, folded, and let the warning above qualify it.
            # Folded rather than inline because the untrustworthy cases
            # include the whole-history replay, where this body is every
            # commit the repository has ever had.
            echo "<details><summary>What release-please's dry run produced for this merge</summary>"
            echo
            cat trimmed-output.txt
            echo
            echo "</details>"
          elif [ "$pr_contributes" = false ]; then
            echo "**This PR does not cause a release.** It adds nothing releasable; it will simply be part of the release that is already pending on \`$BASE_REF\`, whose changelog would be:"
            echo
            cat trimmed-output.txt
          elif [ "$would_release" = true ]; then
            cat trimmed-output.txt
          else
            echo "No releasable changes detected."
          fi
        } > comment-detail.md

    - name: Remove previous preview comment
      if: inputs.post-comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        comment_ids=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
          --jq '.[] | select(.body | contains("<!-- release-please-preview -->")) | .id')
        for id in $comment_ids; do
          gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id"
        done

    - name: Post preview comment
      if: inputs.post-comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ steps.build_merge.outputs.base_sha }}
      run: |
        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        # The title is shown in a code span below, and a PR title is free
        # text that can contain a backtick of its own. Strip them rather
        # than let one close the span early and spill the rest of the
        # footer out as prose.
        title_display=${PR_TITLE//\`/}

        {
          echo "<!-- release-please-preview -->"
          echo "# 🤖 release-please PREVIEW"
          echo
          # Above the prediction rather than below it: every preflight
          # warning qualifies the version and changelog that follow, so
          # they want reading first. A missing file means preflight was
          # switched off; an empty one means it found nothing to say.
          if [ -s "$RUNNER_TEMP/preflight-warnings.md" ]; then
            echo "> [!WARNING]"
            echo "> Preflight found problems with the setup this prediction depends on, so what follows may not be accurate:"
            echo ">"
            sed 's/^/> /' "$RUNNER_TEMP/preflight-warnings.md"
            echo
          fi
          echo "What merging this PR into \`${{ github.event.pull_request.base.ref }}\` would trigger:"
          echo
          cat comment-detail.md
          echo

          # Name the three inputs the prediction was computed from, so a
          # reader can tell whether it still describes the PR in front of
          # them. All three move: the head on a push, the title on a
          # rename, and the base whenever anything else merges — and that
          # last one re-runs nothing, since another PR merging is not an
          # event on this one.
          #
          # The title is here because the SHAs alone do not settle it. Two
          # runs racing after a simultaneous force-push and rename hold the
          # *same* head SHA and differ only in the title they were handed,
          # which is exactly how a stale prediction ends up looking
          # authoritative.
          echo "<sub>Predicted from \`${HEAD_SHA:0:7}\` merged into \`${{ github.event.pull_request.base.ref }}\` at \`${BASE_SHA:0:7}\`, with the PR title read as \`$title_display\` · [Full run]($run_url)</sub>"
        } > comment-body.md
        gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment-body.md

    # A label's color is a repo-wide property of the label itself, not a
    # per-application snapshot — recoloring it here changes how it displays
    # on every open PR currently wearing it, not just this one. That's fine
    # in practice for repos that normally only have one release-triggering
    # PR (or release-please's own release PR) open at a time. If the
    # calling repo also recolors this same label from its own
    # release-please workflow (e.g. release-please's generated release PR),
    # keep both color schemes in sync so the label means the same thing
    # everywhere it shows up: green (patch) is the routine, expected case;
    # yellow (minor) is new-but-compatible; red (major) is the one worth a
    # second look before merging; grey means a release would happen but the
    # bump couldn't be determined, and the preview comment says why.
    - name: Label PR if it would trigger a release
      if: inputs.post-comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_LABEL: ${{ inputs.release-label }}
      run: |
        gh label create "$RELEASE_LABEL" --color FF0000 --force --repo "${{ github.repository }}"
        if [ "${{ steps.extract.outputs.would_release }}" = true ] && [ "${{ steps.extract.outputs.pr_contributes }}" != false ]; then
          case "${{ steps.extract.outputs.bump_type }}" in
            major) color=D93F0B ;;
            minor) color=FBCA04 ;;
            patch) color=0E8A16 ;;
            *) color=6E7781 ;;
          esac
          gh label edit "$RELEASE_LABEL" --color "$color" --repo "${{ github.repository }}"
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-label "$RELEASE_LABEL"
        else
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label "$RELEASE_LABEL" || true
        fi
